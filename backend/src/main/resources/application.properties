spring.datasource.url=jdbc:mysql://localhost:3306/montacargas_obregon
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Correo para enviar la carta responsiva al cliente (OHU-04).
# Los datos de la cuenta van en .env (ver .env.example). Sin MAIL_HOST el envío responde con error.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Si el servidor no responde en 10 s se toma como envío fallido
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# La carta firmada que se sube al registrar la firma (OHU-05) puede pesar hasta 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Quién aparece como remitente; si se deja vacío se usa MAIL_USER
montacargas.correo.remitente=${MAIL_FROM:${MAIL_USER:}}
