spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]

# Conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/montacargas_obregon?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el SQL que se ejecuta
spring.jpa.show-sql=true
